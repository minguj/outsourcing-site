name: Container images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment eligibility and rollback
        run: python3 -m unittest discover -s ops -p 'test_*.py' -v
      - name: Verify rollback with real Docker containers
        run: |
          docker pull caddy:2
          sudo mkdir -p /var/lib/outsourcing-deploy
          sudo python3 ops/check_rollback_docker.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          # Backend needs the same real XLSX/CSV assets served by the frontend.
          context: ${{ matrix.service == 'backend' && '.' || './frontend' }}
          file: ./${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/minguj/outsourcing-site-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/minguj/outsourcing-site
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Release instructions
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: echo 'Image published. Wait for the smoke job before deploying.' >> "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: [build, deployment-agent]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test published images and Caddy routes
        run: |
          cp backend.env.example backend.env
          bash scripts/deploy.sh "$IMAGE_TAG"
      - name: Container logs
        if: always()
        run: docker compose logs --tail=100
      - name: Clean up runner containers
        if: always()
        run: docker compose down
      - name: Release instructions
        run: echo 'Images and Caddy routes verified for ${{ github.sha }}.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [deployment-agent, build, smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, outsourcing-deploy]
    timeout-minutes: 30
    permissions: {}
    concurrency:
      group: outsourcing-site-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      # No checkout or repository scripts run with ubuntu/root on EC2.
      - name: Deploy this workflow commit with backup and rollback
        shell: bash
        run: sudo -n /usr/local/sbin/outsourcing-deploy-sha "$DEPLOY_SHA"
