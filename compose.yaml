services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 96m
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/minguj/outsourcing-site-frontend:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging: *logging

  backend:
    image: ghcr.io/minguj/outsourcing-site-backend:${IMAGE_TAG:?Set IMAGE_TAG to a full Git commit SHA}
    restart: unless-stopped
    init: true
    env_file:
      - ./backend.env
    environment:
      DATA_DIR: /app/data
    volumes:
      # 상담·견적·결제 기록(SQLite). 배포·롤백과 무관하게 유지된다.
      - backend_data:/app/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)) == {'status':'ok'}"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
  backend_data:
