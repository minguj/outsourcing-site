# 신재생 설비 라이브러리 (초기 기획용)
#
# 생산량: 정부 고시값을 쓴다.
#   「신·재생에너지 설비의 지원 등에 관한 규정」 [별표 2] 공급의무비율 산정기준의 '단위 에너지 생산량'
#   (태양광 고정식 1,358 / BIPV 923 / 지열 수직밀폐형 864 / 연료전지 PEMFC 7,415 kWh/kW·yr)
# 태양광은 지역 일사량 차이가 커서 지역별 실측 연구값으로 보정한다 (solar_by_region).
#
# 단가: 공식 '총 설치비' 자료가 없어 가정값이다. 실견적으로 바꿔야 한다.
#   참고(하한 근거): 2026 재생에너지보급(건물지원) 보조금 지원단가 — 태양광 52.5만 원/kW, 지열(수직밀폐형) 73.9만 원/kW,
#   2025 건물지원 연료전지 702.7만 원/kW. 보조금은 설치비의 일부이므로 실제 설치비는 이보다 크다.
schema_version: 1
id: equipment-library-demo
version: "2026.11.10"

regulation_source:
  title: 신·재생에너지 설비의 지원 등에 관한 규정 [별표 2] 단위 에너지 생산량
  url: https://www.knrec.or.kr/biz/introduce/new_policy/intro_govinstall.do?gubun=A
  checked_on: "2026-11-10"

# 태양광 연간 발전량 (kWh/kWp·yr), 시도코드(PNU 앞 2자리)별
# 근거: 한국태양에너지학회 논문(2019) 전국 관측소 분석 — 전국 평균 1,312, 서울 1,165, 제주 1,197, 목포 1,434
# 서울시도 주택태양광 발전량을 하루 3.2시간 기준으로 계산한다.
solar_by_region:
  source: 한국태양에너지학회 논문(2019), 국내 지역별 태양광 발전량 분석
  default: { value: 1312, label: 전국 평균 }
  regions:
    "11": { value: 1165, label: 서울 }
    "50": { value: 1197, label: 제주 }
    "46": { value: 1434, label: 전남 (목포 관측값) }

equipment:
  - key: pv_roof
    name: 태양광 (옥상)
    unit: kWp
    step: 1
    unit_cost_krw: 1800000
    yield_from_region: true      # 지역별 발전량 사용
    area_per_unit: { value: 10, unit: ㎡/kWp, note: 모듈 면적 + 음영 이격 (가정) }
    output: electricity
    limit: roof
  - key: pv_bipv
    name: 건물일체형 태양광 (남측 입면)
    unit: kWp
    step: 1
    unit_cost_krw: 3500000
    specific_yield: { value: 923, unit: kWh/kWp·yr, note: 규정 별표 2 BIPV 단위 에너지 생산량. 지역 보정은 옥상 태양광과 같은 비율로 적용 }
    regional_scaling: true
    area_per_unit: { value: 7, unit: ㎡/kWp, note: 가정 }
    output: electricity
    limit: facade
  - key: geothermal
    name: 지열 히트펌프 (수직밀폐형)
    unit: 공
    step: 1
    unit_cost_krw: 21000000
    capacity_per_unit: { value: 10.5, unit: kW/공, note: 150m 천공 1공 약 3RT (가정) }
    specific_yield: { value: 864, unit: kWh/kW·yr, note: 규정 별표 2 지열 수직밀폐형 단위 에너지 생산량 }
    area_per_unit: { value: 25, unit: ㎡/공, note: 천공 간격 5m (가정) }
    output: renewable_heat
    limit: open_space
  - key: fuel_cell
    name: 건물용 연료전지 (PEMFC)
    unit: kW
    step: 1
    unit_cost_krw: 25000000
    operating_hours: { value: 7415, unit: h/yr, note: "규정 별표 2 PEMFC 단위 에너지 생산량 7,415 kWh/kW·yr 를 전부하 발전시간으로 해석" }
    electric_efficiency: { value: 0.40, unit: "-", note: 가정 }
    heat_to_power_ratio: { value: 1.0, unit: "-", note: 가정 }
    max_kw_per_gfa: { value: 0.01, unit: kW/㎡, note: 건물 열수요로 소화 가능한 용량 상한 (가정) }
    output: chp
    limit: gfa
