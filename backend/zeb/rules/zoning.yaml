# 용도지역별 건폐율·용적률 규칙
#
# 원칙
#  - 법정 상한(national)과 지자체 조례(ordinances)를 분리해 관리한다.
#  - 적용값 = min(조례값, 법정 상한). 조례가 등록되지 않은 지역은 법정 상한을 쓰되 경고를 남긴다.
#  - 각 값에는 verified 플래그를 둔다. false 인 값은 화면/보고서에 "검토 필요"로 표시된다.
#  - 값을 바꿀 때는 PR 에 근거 링크를 첨부하고 checked_on 을 갱신한다 (docs/adr/0002 참고).

schema_version: 1

national:
  id: kr-nat-zoning
  title: 국토의 계획 및 이용에 관한 법률 시행령
  ref: 제84조(용도지역안에서의 건폐율), 제85조(용도지역 안에서의 용적률)
  url: https://www.law.go.kr/법령/국토의계획및이용에관한법률시행령
  checked_on: "2026-11-09"
  # far 는 시행령 범위의 상한값(%)
  zones:
    제1종전용주거지역: { bcr: 50, far: 100, verified: false }
    제2종전용주거지역: { bcr: 50, far: 150, verified: false }
    제1종일반주거지역: { bcr: 60, far: 200, verified: false }
    제2종일반주거지역: { bcr: 60, far: 250, verified: true }
    제3종일반주거지역: { bcr: 50, far: 300, verified: true }
    준주거지역:        { bcr: 70, far: 500, verified: true }
    중심상업지역:      { bcr: 90, far: 1500, verified: false }
    일반상업지역:      { bcr: 80, far: 1300, verified: true }
    근린상업지역:      { bcr: 70, far: 900, verified: false }
    유통상업지역:      { bcr: 80, far: 1100, verified: false }
    전용공업지역:      { bcr: 70, far: 300, verified: false }
    일반공업지역:      { bcr: 70, far: 350, verified: false }
    준공업지역:        { bcr: 70, far: 400, verified: false }
    보전녹지지역:      { bcr: 20, far: 80, verified: false }
    생산녹지지역:      { bcr: 20, far: 100, verified: false }
    자연녹지지역:      { bcr: 20, far: 100, verified: false }
  aliases:
    제2종일반주거지역(7층이하): 제2종일반주거지역

ordinances:
  - id: seoul-urban-planning-ordinance
    jurisdiction: "11"            # 시도코드 (PNU 앞 2자리)
    jurisdiction_name: 서울특별시
    title: 서울특별시 도시계획 조례
    ref: 제54조(용도지역안에서의 건폐율), 제55조(용도지역안에서의 용적률)
    url: https://www.law.go.kr/자치법규/서울특별시도시계획조례
    effective_from: null          # 개별 조항 시행일 미확정 -> checked_on 기준으로 사용
    checked_on: "2026-11-09"
    zones:
      제1종전용주거지역: { bcr: 50, far: 100, verified: false }
      제2종전용주거지역: { bcr: 40, far: 120, verified: false }
      제1종일반주거지역: { bcr: 60, far: 150, verified: false }
      제2종일반주거지역: { bcr: 60, far: 200, verified: true }
      제2종일반주거지역(7층이하): { bcr: 60, far: 200, max_floors: 7, verified: true }
      제3종일반주거지역: { bcr: 50, far: 250, verified: true }
      준주거지역:        { bcr: 60, far: 400, verified: true }
      중심상업지역:      { bcr: 60, far: 1000, verified: false, note: 역사도심 지역은 별도 기준 }
      일반상업지역:      { bcr: 60, far: 800, verified: true, note: 역사도심 지역은 별도 기준 }
      근린상업지역:      { bcr: 60, far: 600, verified: false }
      유통상업지역:      { bcr: 60, far: 600, verified: false }
      전용공업지역:      { bcr: 60, far: 200, verified: false }
      일반공업지역:      { bcr: 60, far: 200, verified: false }
      준공업지역:        { bcr: 60, far: 400, verified: false }
      보전녹지지역:      { bcr: 20, far: 50, verified: false }
      생산녹지지역:      { bcr: 20, far: 50, verified: false }
      자연녹지지역:      { bcr: 20, far: 50, verified: false }
    # 용도(건축물 용도)에 따라 달라지는 값
    use_overrides:
      준공업지역:
        공동주택:
          far: 250
          verified: true
          note: 공동주택 기본 250%. 2024년 조례 개정으로 공공기여 등 조건 충족 시 최대 400%까지 완화 가능 (기본값에는 미반영)

# 토지이용계획(지역·지구)에 따른 경고.
#  - 필지에 '포함'되거나 일부 '저촉'되는 항목만 본다. '접함'(인접 필지)은 이 필지의 규제가 아니다.
#  - severity 기본값 critical: 자동 계산값을 확정값처럼 쓰면 안 되는 경우.
override_plans:
  - keyword: 지구단위계획구역
    message: 지구단위계획구역에 포함됩니다. 기준·허용·상한 용적률은 해당 지구단위계획 결정고시가 우선하므로 고시문을 확인해야 합니다.
  - keyword: 정비구역
    message: 정비구역에 포함됩니다. 정비계획 결정 용적률이 우선 적용됩니다.
  - keyword: 특별계획구역
    message: 특별계획구역에 포함됩니다. 별도 세부개발계획을 확인해야 합니다.
  # height_related: 높이를 제한하지만 높이값은 토지이용계획 데이터에 없다 → 고시문의 값을 '높이 제한(m)'에 입력해야 한다.
  - keyword: 가로구역별 최고높이
    severity: warning
    height_related: true
    message: 가로구역별 최고높이 제한지역입니다. 고시된 최고높이를 '높이 제한(m)'에 입력해야 규모가 맞게 나옵니다.
  - keyword: 고도지구
    severity: warning
    height_related: true
    message: 고도지구(최고고도지구)입니다. 도시관리계획으로 정한 최고 높이·층수를 '높이 제한(m)'에 입력해야 규모가 맞게 나옵니다.
  - keyword: 비행안전구역
    severity: warning
    height_related: true
    message: 비행안전구역입니다. 군 비행장 주변 구역별 높이 제한이 있으므로 해당 높이를 '높이 제한(m)'에 입력하세요.
  - keyword: 경관지구
    severity: warning
    height_related: true
    message: 경관지구입니다. 지자체 조례로 건축물 높이·층수가 제한될 수 있으므로 확인 후 '높이 제한(m)'에 입력하세요.
  - keyword: 대공방어협조구역
    severity: info
    height_related: true
    message: 대공방어협조구역입니다. 일정 높이 이상 건축 시 관할 부대와 협의가 필요합니다.

# 지목(토지대장상 토지 용도)에 따른 판단
land_categories:
  not_buildable:
    values: [도로, 철도용지, 제방, 하천, 구거, 유지, 수도용지]
    severity: critical
    message: "지목이 '{category}'입니다. 일반적인 건축 대상지가 아니므로 이 계산은 참고용입니다 (도시계획시설·지목 변경 여부 확인 필요)."
  conversion_required:
    values: [전, 답, 과수원, 목장용지, 임야]
    severity: warning
    message: "지목이 '{category}'입니다. 건축하려면 농지·산지 전용 등 개발행위허가가 필요합니다."
