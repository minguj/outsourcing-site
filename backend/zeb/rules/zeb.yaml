# 제로에너지건축물(ZEB) 인증 등급·의무화·인센티브 규칙
schema_version: 1

grade_sets:
  - id: zeb-cert-2025
    title: 제로에너지건축물 인증 기준 (국토교통부·산업통상자원부 고시)
    ref: 에너지자립률 기준 등급
    url: https://zeb.energy.or.kr
    effective_from: "2025-01-01"
    checked_on: "2026-11-09"
    verified: true
    # 높은 등급부터. min_self_sufficiency(%) 이상이면 해당 등급
    grades:
      - { grade: "+", label: 플러스 등급, min_self_sufficiency: 120 }
      - { grade: "1", label: 1등급, min_self_sufficiency: 100 }
      - { grade: "2", label: 2등급, min_self_sufficiency: 80 }
      - { grade: "3", label: 3등급, min_self_sufficiency: 60 }
      - { grade: "4", label: 4등급, min_self_sufficiency: 40 }
      - { grade: "5", label: 5등급, min_self_sufficiency: 20 }
    note: >-
      인증은 에너지자립률 또는 단위면적당 1차에너지소요량 기준 중 하나와
      건축물에너지관리시스템(BEMS) 또는 원격검침 전자식 계량기 설치 요건을 함께 충족해야 한다.
      본 엔진은 자립률 경로만 계산한다.

mandates:
  - id: zeb-mandate-private-2025
    title: 민간 건축물 ZEB 인증 의무화 (제3차 녹색건축물 기본계획)
    effective_from: "2025-06-01"
    checked_on: "2026-11-10"
    verified: true
    applies_to: private
    min_gfa_m2: 1000
    min_grade: "5"
    note: 연면적 1,000㎡ 이상 일반건축물, 30세대 이상 공동주택은 '5등급 수준' 설계 의무 (세대수 판정은 본 데모 범위 밖). 2030년 500㎡ 이상으로 확대 예정.
  - id: zeb-mandate-public-4
    title: 공공 건축물 ZEB 4등급 의무화 (교육연구·업무 등 17개 용도)
    effective_from: "2025-01-01"
    checked_on: "2026-11-10"
    verified: true
    applies_to: public
    min_gfa_m2: 1000
    min_grade: "4"
    note: 교육연구·업무 등 17개 용도, 연면적 1,000㎡ 이상 (그 외 공공건축물은 5등급 유지). 2030년 일부 용도·규모는 3등급으로 상향 예정. 근거 - 국토교통부 녹색건축과장 인터뷰(한국건축친환경설비학회지), 제3차 녹색건축물 기본계획

incentives:
  - id: zeb-far-relaxation
    title: 녹색건축물 인증에 따른 건축기준 완화 (건축물의 에너지절약설계기준)
    ref: 녹색건축물 조성 지원법 제15조, 건축물의 에너지절약설계기준 (ZEB 인증 등급별 최대 완화비율)
    checked_on: "2026-11-10"
    verified: true
    max_total_rate: 15
    # 근거: 경기도 녹색건축 설계기준 공고문(제로에너지건축물 인증에 따른 건축기준 최대완화비율 표)
    # 플러스 등급은 표에 없어 1등급과 같게 둠 (확인 필요)
    rate_by_grade: { "+": 15, "1": 15, "2": 14, "3": 13, "4": 12, "5": 11 }
    note: 의무 인증 대상은 의무 등급을 초과하는 경우에만 인정될 수 있으므로 허가권자 확인 필요
